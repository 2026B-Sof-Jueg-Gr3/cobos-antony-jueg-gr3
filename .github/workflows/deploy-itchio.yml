name: Despliegue Continuo a itch.io (Butler)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-itchio:
    name: Publicar en itch.io (HTML5)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Validar presencia de secretos
        env:
          KEY_EXISTS: ${{ secrets.BUTLER_API_KEY != '' }}
          USER_EXISTS: ${{ secrets.ITCH_USERNAME != '' }}
          GAME_EXISTS: ${{ secrets.ITCH_GAME_ID != '' }}
        run: |
          echo "Comprobando disponibilidad de secretos de GitHub..."
          if [ "$KEY_EXISTS" != "true" ]; then echo "ERROR CRÍTICO: El secret BUTLER_API_KEY está vacío o no existe"; exit 1; fi
          if [ "$USER_EXISTS" != "true" ]; then echo "ERROR CRÍTICO: El secret ITCH_USERNAME está vacío o no existe"; exit 1; fi
          if [ "$GAME_EXISTS" != "true" ]; then echo "ERROR CRÍTICO: El secret ITCH_GAME_ID está vacío o no existe"; exit 1; fi
          echo "Todos los secretos están configurados correctamente."

      - name: Instalar Butler CLI oficial
        run: |
          mkdir -p bin
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d bin
          chmod +x bin/butler
          ./bin/butler -V
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Validar archivos del juego
        run: |
          test -f index.html || { echo "ERROR: falta index.html (Landing)"; exit 1; }
          test -f game.html || { echo "ERROR: falta game.html (Simulador)"; exit 1; }
          test -d src || { echo "ERROR: falta carpeta src/"; exit 1; }

      - name: Empaquetar build HTML5
        run: |
          mkdir -p dist
          cp -r index.html game.html src assets dist/

      - name: Publicar build con Butler en itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ secrets.ITCH_USERNAME }}
          ITCH_GAME: ${{ secrets.ITCH_GAME_ID }}
        run: |
          ./bin/butler push dist "${ITCH_USER}/${ITCH_GAME}:html5" --userversion "${GITHUB_SHA::7}"
