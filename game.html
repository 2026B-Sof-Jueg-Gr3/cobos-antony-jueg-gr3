<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Vanguard - Protocolo de Combate</title>
  <!-- Inclusión de Phaser 3 mediante CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #151828 0%, #07080e 100%);
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }
    .top-bar {
      width: 800px;
      max-width: 95vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: rgba(13, 14, 21, 0.85);
      border: 1px solid #1f293d;
      border-radius: 4px;
    }
    .top-bar a {
      color: #39ff14;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      transition: color 0.2s;
    }
    .top-bar a:hover {
      color: #ffea00;
      text-shadow: 0 0 6px #ffea00;
    }
    .status-badge {
      color: #94a3b8;
      font-size: 12px;
      letter-spacing: 1px;
    }
    #game-container {
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.18), 0 0 10px rgba(57, 255, 20, 0.12);
      border: 2px solid #00f0ff;
      border-radius: 4px;
      background: #0d0e15;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html">◄ VOLVER AL CENTRO DE MANDO (TERMINAL)</a>
    <span class="status-badge">SIMULADOR CUÁNTICO // FASE 1: ONLINE</span>
  </div>

  <div id="game-container"></div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
